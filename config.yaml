# Configuration for ComPilot

# --- LLM configuration ---
# Values of the form ${VAR} or ${VAR:-default} are read from the environment
# (and from a .env file in the repo root, if present; see .env.example).
# llm_id: model id served by the OpenAI-compatible endpoint at base_url
#   (e.g. claude-haiku-5-5, gemini-3.8-flash, gpt-4o, Qwen/Qwen3.5-9B on a local vLLM/Ollama server).
# openai_api_key: API key for that endpoint (any non-empty string works for most local servers).

# Claude (default), through Anthropic's OpenAI-compatible endpoint.
# Claude 5 models reject temperature/top_p other than their defaults, so ComPilot
# does not send them (or seed) to this endpoint; thinking is on by default.
llm_id: "${LLM_ID:-claude-haiku-5-5}"
base_url: "${LLM_BASE_URL:-https://api.anthropic.com/v1/}"
openai_api_key: "${ANTHROPIC_API_KEY}"

# Gemini, through Google's OpenAI-compatible endpoint:
# llm_id: "${LLM_ID:-gemini-3.8-flash}"
# base_url: "${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}"
# openai_api_key: "${GEMINI_API_KEY}"

# --- Environment paths ---
# Directory of benchmark folders (each with a <name>_generator.cpp).
# Quick test: 5 PolyBench MEDIUM kernels (2mm, heat3d, symm, syr2k, trisolv).
benchmarks_dir: "./benchmarks/polybench_medium5/"
# Full PolyBench suite (30 kernels; sizes: MINI, SMALL, MEDIUM, LARGE, XLARGE):
# benchmarks_dir: "./benchmarks/polybench/MINI/"
tiralib_dir: "./TiraLib/"             # path to a compiled TiraLib checkout
lookup_dir_suffix: "base"             # results of already-tried schedules are cached under lookup_dir_<suffix>/
base_results_dir: "./results"

# --- Exploration hyperparameters ---
# Interaction format between the system and the LLM:
#   conversational : a growing back-and-forth transcript, resent in full every turn.
#   compact        : a single message per turn holding the loop nest, the frozen
#                    program analysis, and a summary (log) of everything explored so
#                    far. Only [system prompt, this message] are sent each turn, which
#                    keeps token cost low while aiming for the same optimization quality.
#                    Runs are tagged with a "_compact" suffix on the experiment name.
interaction_mode: conversational
max_llm_responses: 50          # hard cap on the number of LLM turns per benchmark
min_nb_suggestions: 30         # keep nudging the LLM to explore until it has tried at least this many schedules
nb_exec_init: 15               # number of executions used to measure the initial (unoptimized) runtime
min_runs_scheds: 3             # min executions when timing a candidate schedule
max_runs_scheds: 10            # max executions when timing a candidate schedule
time_budget_factor_scheds: 10  # per-schedule timing budget = this factor * initial execution time
top_p: 1
temperature: 1
nb_responses: 1
enable_thinking: true          # enable the model's thinking mode (if supported by the endpoint)

# Reuse cached compiler feedback for previously-seen schedules. Set to false to
# force freshly generated feedback for every schedule (useful when comparing
# feedback wording or running independent stochastic runs). The numeric caches
# (initial execution time, skewing factors) are always kept.
use_response_lookup: true

# When an illegal schedule combines several transformations, pinpoint which one is
# responsible by legality-checking each on its own. Helpful but adds one extra
# legality check per component, so it is off by default (noticeable on large programs).
localize_illegality: false

experiment_name: "compilot_run"
